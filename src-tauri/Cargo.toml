[package]
name = "desknote"
version = "1.2.0"
description = "D-Note — offline, encrypted, Notion-style desktop notes"
authors = ["D-Note"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-stronghold = "2"
# Full-database encryption at rest. SQLCipher (vendored, with vendored OpenSSL)
# so the build needs no system SQLite/OpenSSL — only a C toolchain + NASM.
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
uuid = { version = "1", features = ["v4"] }

[target."cfg(windows)".dependencies]
tauri-plugin-single-instance = "2"
winreg = "0.55"

