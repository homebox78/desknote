<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>D-Note</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" />
<style>
:root { --accent: #232427; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  background: #d9dbe0;
  background-image: radial-gradient(1200px 700px at 30% -10%, #e6e8ee 0%, #cdd0d8 55%, #c2c5cf 100%);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  color: #21242c;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input { font-family: inherit; }

/* ===== Desktop + window shell ===== */
.dn-desktop {
  height: 100vh; width: 100vw;
  display: grid; place-items: center;
  padding: clamp(10px, 3vh, 40px);
}
.dn-window {
  width: min(96vw, 1240px);
  height: min(94vh, 820px);
  border-radius: 12px;
  overflow: hidden;
  display: flex; flex-direction: column;
  box-shadow: 0 1px 0 rgba(255,255,255,.5) inset, 0 30px 70px -20px rgba(20,24,40,.45), 0 8px 24px -8px rgba(20,24,40,.3);
  background: var(--bg);
  position: relative;
}

/* ===== Theme tokens ===== */
.dn-window[data-theme="light"] {
  --bg: #ffffff;
  --side-bg: #f7f7f8;
  --tb-bg: #f0f0f1;
  --tb-border: #e4e4e6;
  --text: #1d1e21;
  --text-2: #6b6c70;
  --text-3: #9b9c9f;
  --border: #ebebed;
  --border-strong: #dededf;
  --hover: #efeff0;
  --accent: #232427;
  --on-accent: #ffffff;
  --active-bg: #ebebed;
  --active-text: #1d1e21;
  --code-bg: #f5f5f6;
  --card: #ffffff;
  --shadow-card: 0 1px 2px rgba(20,22,28,.06), 0 1px 0 rgba(20,22,28,.04);
  --overlay: rgba(24,25,28,.34);
  --modal-bg: #ffffff;
}
.dn-window[data-theme="dark"] {
  --bg: #1a1b1d;
  --side-bg: #161719;
  --tb-bg: #202023;
  --tb-border: #2c2c2f;
  --text: #e8e8ea;
  --text-2: #9a9b9e;
  --text-3: #6a6b6e;
  --border: #2a2a2d;
  --border-strong: #36363a;
  --hover: #26262a;
  --accent: #cdced2;
  --on-accent: #18191b;
  --active-bg: #2e2f33;
  --active-text: #ffffff;
  --code-bg: #222326;
  --card: #202023;
  --shadow-card: 0 1px 2px rgba(0,0,0,.3);
  --overlay: rgba(0,0,0,.5);
  --modal-bg: #222326;
}
.dn-window { color: var(--text); }

/* ===== Titlebar ===== */
.dn-titlebar {
  height: 40px; flex: 0 0 40px;
  display: flex; align-items: center; justify-content: space-between;
  background: var(--tb-bg);
  border-bottom: 1px solid var(--tb-border);
  padding: 0 6px 0 12px;
  user-select: none;
}
.dn-tb-left { display: flex; align-items: center; gap: 9px; color: var(--text-2); }
.dn-tb-title { font-size: 12.5px; font-weight: 500; color: var(--text-2); letter-spacing: .1px; }
.dn-tb-controls { display: flex; align-items: center; gap: 1px; }
.dn-tb-btn {
  width: 38px; height: 30px; border-radius: 7px;
  display: grid; place-items: center; color: var(--text-2);
  transition: background .12s, color .12s;
}
.dn-tb-btn:hover { background: var(--hover); color: var(--text); }
.dn-tb-btn.is-on { color: var(--accent); }
.dn-tb-div { width: 1px; height: 18px; background: var(--tb-border); margin: 0 5px; flex: 0 0 auto; }
.dn-tb-close:hover { background: var(--text); color: var(--bg); }

/* ===== Body / layout ===== */
.dn-body { flex: 1; display: flex; min-height: 0; }

/* ===== Sidebar ===== */
.dn-sidebar {
  width: var(--side-w, 256px); flex: 0 0 var(--side-w, 256px);
  background: var(--side-bg);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  padding: 10px 8px 14px;
  overflow-y: auto;
  gap: 2px;
}
.dn-side-head {
  display: flex; align-items: center; gap: 9px;
  padding: 6px 8px 10px;
}
.dn-side-brand { font-size: 15px; font-weight: 700; letter-spacing: -.2px; }
.dn-side-group { display: flex; flex-direction: column; gap: 1px; }
.dn-side-section {
  padding: 14px 10px 5px; font-size: 11.5px; font-weight: 600;
  color: var(--text-3); letter-spacing: .2px;
}
.dn-side-foot { margin-top: 10px; }

.dn-srow {
  display: flex; align-items: center; gap: 9px;
  padding: 6px 10px; border-radius: 7px;
  font-size: 13.5px; color: var(--text-2); font-weight: 450;
  text-align: left; width: 100%;
  transition: background .1s, color .1s;
  white-space: nowrap; overflow: hidden;
}
.dn-srow-ic { color: var(--text-3); display: grid; place-items: center; }
.dn-srow-label { overflow: hidden; text-overflow: ellipsis; flex: 1; }
.dn-srow:hover { background: var(--hover); color: var(--text); }
.dn-srow:hover .dn-srow-ic { color: var(--text-2); }
.dn-srow.is-active { background: var(--active-bg); color: var(--active-text); font-weight: 600; }
.dn-srow.is-active .dn-srow-ic { color: var(--accent); }
.dn-window[data-theme="dark"] .dn-srow.is-active .dn-srow-ic { color: #fff; }
.dn-srow.is-muted { color: var(--text-3); }
.dn-kbd {
  font-size: 10.5px; font-weight: 600; color: var(--text-3);
  background: color-mix(in srgb, var(--text-3) 16%, transparent);
  padding: 1px 6px; border-radius: 5px; letter-spacing: .3px;
}
.dn-kbd--inline { margin: 0 2px; }

.dn-srow-fav { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 5px; color: var(--text-3); opacity: 0; flex: 0 0 auto; transition: opacity .12s, color .12s, background .12s; }
.dn-srow:hover .dn-srow-fav { opacity: .5; }
.dn-srow-fav:hover { opacity: 1; background: var(--hover); color: var(--text-2); }
.dn-srow-fav.is-fav { opacity: 1; color: var(--accent); }
.dn-srow-fav.is-fav svg { fill: color-mix(in srgb, var(--accent) 20%, transparent); }

.dn-density-compact .dn-srow { padding: 4px 9px; font-size: 12.5px; gap: 8px; }
.dn-density-compact .dn-side-head { padding: 4px 8px 8px; }
.dn-density-compact .dn-side-section { padding: 10px 9px 4px; }

/* ===== Logo mark ===== */
.dn-logo {
  background: var(--accent);
  color: var(--on-accent);
  box-shadow: 0 1px 2px rgba(0,0,0,.18), 0 0 0 1px rgba(0,0,0,.06) inset;
}

/* ===== Main ===== */
.dn-main { flex: 1; min-width: 0; background: var(--bg); display: flex; flex-direction: column; }
.dn-empty {
  flex: 1; display: grid; place-items: center; color: var(--text-3);
  font-size: 14px;
}
.dn-doc-scroll { flex: 1; overflow-y: auto; }
.dn-doc, .dn-db { max-width: 860px; margin: 0 auto; padding: 56px 40px 120px; }
.dn-db { max-width: 1040px; }
.dn-doc--wide, .dn-db--wide { max-width: none; }

.dn-doc-iconwrap { margin-bottom: 18px; }
.dn-doc-icon, .dn-db-icon {
  width: 70px; height: 70px; border-radius: 16px;
  display: grid; place-items: center; color: var(--text-3);
  background: color-mix(in srgb, var(--text-3) 9%, transparent);
}
.dn-db-icon { color: var(--accent); background: color-mix(in srgb, var(--accent) 11%, transparent); }
.dn-doc-title {
  font-size: 38px; font-weight: 800; letter-spacing: -1px;
  line-height: 1.15; margin-bottom: 14px; color: var(--text);
}
.dn-doc-title.is-placeholder { color: var(--text-3); opacity: .55; }

/* export bar / chips */
.dn-exportbar { display: flex; gap: 8px; margin-bottom: 34px; flex-wrap: wrap; }
.dn-chip {
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  padding: 6px 13px; border-radius: 8px; font-size: 12.5px; font-weight: 500;
  color: var(--text-2); border: 1px solid var(--border-strong);
  background: var(--card); transition: background .12s, border-color .12s, color .12s;
}
.dn-chip:hover { background: var(--hover); color: var(--text); border-color: var(--text-3); }
.dn-chip--ic { color: var(--text-2); }

/* ===== Blocks ===== */
.dn-doc-empty { color: var(--text-3); font-size: 16px; }
.dn-blocks { display: flex; flex-direction: column; gap: 2px; }
.dn-block { position: relative; padding: 3px 0; }
.dn-block-handle {
  position: absolute; left: -42px; top: 50%; transform: translateY(-50%);
  display: flex; gap: 1px; color: var(--text-3); opacity: 0;
  transition: opacity .12s;
}
.dn-block:hover > .dn-block-handle { opacity: 1; }
.dn-block-handle > svg { padding: 2px; border-radius: 5px; }
.dn-block-handle > svg:hover { background: var(--hover); color: var(--text-2); }

.dn-h1 h1 { font-size: 27px; font-weight: 800; letter-spacing: -.5px; margin: 22px 0 4px; line-height: 1.25; }
.dn-h2 h2 { font-size: 21px; font-weight: 750; letter-spacing: -.3px; margin: 16px 0 2px; line-height: 1.3; }
.dn-p p { font-size: calc(16px * var(--fs, 1)); line-height: 1.75; color: var(--text); }
.dn-p p, .dn-li p { color: color-mix(in srgb, var(--text) 92%, var(--text-2)); }
.dn-li-row { display: flex; gap: 12px; align-items: flex-start; }
.dn-li p { font-size: calc(16px * var(--fs, 1)); line-height: 1.75; flex: 1; }
.dn-bullet {
  width: 6px; height: 6px; border-radius: 50%; background: var(--text);
  margin-top: 11px; flex: 0 0 auto; opacity: .85;
}
.dn-block strong { font-weight: 700; color: var(--text); }

/* inline editing */
.dn-edit { outline: none; cursor: text; }
.dn-edit:empty::before { content: attr(data-ph); color: var(--text-3); pointer-events: none; }
.dn-block code, .dn-edit code { font-family: ui-monospace, Menlo, monospace; font-size: .88em; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
.dn-block-handle { cursor: pointer; }
.dn-doc-title-edit { outline: none; cursor: text; }
.dn-doc-title-edit:empty::before { content: attr(data-ph); color: var(--text-3); opacity: .5; pointer-events: none; }
.dn-doc-empty { cursor: text; }

/* editor right-click block menu */
.dn-emenu { position: fixed; z-index: 200; width: 224px; background: var(--modal-bg); border: 1px solid var(--border-strong); border-radius: 11px; box-shadow: 0 14px 36px -8px rgba(15,18,30,.42); padding: 6px; }
.dn-emenu-fmt { display: flex; gap: 4px; padding: 2px 2px 7px; border-bottom: 1px solid var(--border); margin-bottom: 5px; }
.dn-emenu-fmt button { flex: 1; height: 30px; border-radius: 7px; color: var(--text-2); font-size: 14px; display: grid; place-items: center; }
.dn-emenu-fmt button:hover { background: var(--hover); color: var(--text); }
.dn-emenu-code { font-family: ui-monospace, Menlo, monospace; font-size: 12px !important; }
.dn-emenu-sec { font-size: 11px; font-weight: 600; color: var(--text-3); padding: 4px 9px 3px; }
.dn-emenu-item { display: flex; align-items: center; gap: 9px; width: 100%; padding: 7px 9px; border-radius: 7px; font-size: 13px; color: var(--text); text-align: left; }
.dn-emenu-item span { flex: 1; }
.dn-emenu-item:hover { background: var(--hover); }
.dn-emenu-item svg { color: var(--text-3); flex: 0 0 auto; }
.dn-emenu-item.is-on, .dn-emenu-item.is-on svg, .dn-emenu-chk { color: var(--accent) !important; }
.dn-emenu-div { height: 1px; background: var(--border); margin: 5px 0; }
.dn-emenu-danger:hover { background: var(--text); color: var(--bg); }
.dn-emenu-danger:hover svg { color: var(--bg); }
.dn-quote blockquote {
  border-left: 3px solid var(--accent);
  padding: 4px 0 4px 18px; margin: 6px 0;
  font-size: calc(16px * var(--fs, 1)); line-height: 1.7; color: var(--text-2); font-style: normal;
}
.dn-codeblock pre {
  background: var(--code-bg); border: 1px solid var(--border);
  border-radius: 10px; padding: 18px 20px; margin: 8px 0;
  font-family: "SFMono-Regular", "JetBrains Mono", ui-monospace, Menlo, monospace;
  font-size: 12.5px; line-height: 1.65; color: var(--text);
  white-space: pre; overflow-x: auto;
}

/* ===== Database bar / tabs ===== */
.dn-db-bar {
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--border); padding-bottom: 9px; margin-bottom: 4px;
  margin-top: 22px;
}
.dn-viewtabs { display: flex; gap: 2px; }
.dn-vtab {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 11px; border-radius: 8px; font-size: 13px; font-weight: 500;
  color: var(--text-2); transition: background .12s, color .12s;
}
.dn-vtab:hover { background: var(--hover); color: var(--text); }
.dn-vtab.is-active { background: var(--active-bg); color: var(--active-text); font-weight: 600; }
.dn-window[data-theme="dark"] .dn-vtab.is-active { color: #fff; }
.dn-db-bar-right { display: flex; align-items: center; gap: 12px; }
.dn-db-count { font-size: 12.5px; color: var(--text-3); font-weight: 500; }
.dn-db-viewport { padding-top: 16px; }

/* ===== Status pills & tags ===== */
.dn-pill, .dn-pill-empty, .dn-tag {
  display: inline-flex; align-items: center;
  font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 6px;
  line-height: 1.5; white-space: nowrap;
}
.dn-pill-empty { color: var(--text-3); background: transparent; font-weight: 500; padding-left: 0; }
/* monochrome status: light fill / outlined / solid-dark by intensity */
.dn-pill--todo { color: var(--text-2); background: color-mix(in srgb, var(--text-3) 18%, transparent); }
.dn-pill--doing { color: var(--text); background: transparent; box-shadow: inset 0 0 0 1.3px var(--border-strong); }
.dn-pill--done { color: var(--on-accent); background: var(--accent); }
/* monochrome tags — all neutral, dotted divider feel via subtle border */
.dn-tag--violet, .dn-tag--blue, .dn-tag--amber, .dn-tag--green, .dn-tag--slate {
  color: var(--text-2); background: color-mix(in srgb, var(--text-3) 16%, transparent);
}

/* ===== Table view ===== */
.dn-table { font-size: 13.5px; }
.dn-tr {
  display: grid; grid-template-columns: 1fr 170px 190px 40px;
  border-bottom: 1px solid var(--border);
}
.dn-tr-head { color: var(--text-3); font-weight: 600; font-size: 12.5px; }
.dn-tr:not(.dn-tr-head):hover { background: var(--hover); }
.dn-td { padding: 9px 12px; display: flex; align-items: center; min-height: 40px; border-right: 1px solid var(--border); }
.dn-td-add { border-right: none; justify-content: center; color: var(--text-3); }
.dn-tr-head .dn-td-add { color: var(--text-3); }
.dn-cell-title { color: var(--text); font-weight: 500; }
.dn-td-date { justify-content: space-between; gap: 8px; }
.dn-cell-date { color: var(--text-2); }
.dn-date-ic { color: var(--text-3); }
.dn-table-add {
  display: flex; align-items: center; gap: 7px; padding: 10px 12px;
  font-size: 13px; color: var(--text-3); font-weight: 500; width: 100%;
}
.dn-table-add:hover { color: var(--text-2); background: var(--hover); }

/* ===== Board view ===== */
.dn-board {
  display: flex; gap: 14px; overflow-x: auto; padding-bottom: 14px;
  align-items: flex-start;
}
.dn-bcol { flex: 0 0 270px; display: flex; flex-direction: column; gap: 8px; }
.dn-bcol-head { display: flex; align-items: center; gap: 8px; padding: 2px 4px; }
.dn-bcol-count { font-size: 12.5px; color: var(--text-3); font-weight: 600; }
.dn-bcol-body { display: flex; flex-direction: column; gap: 8px; }
.dn-bcard {
  background: var(--card); border: 1px solid var(--border-strong);
  border-radius: 9px; padding: 11px 12px; box-shadow: var(--shadow-card);
  display: flex; flex-direction: column; gap: 8px;
  cursor: pointer; transition: border-color .12s, box-shadow .12s;
}
.dn-bcard:hover { border-color: var(--text-3); }
.dn-bcard-title { font-size: 13.5px; font-weight: 550; color: var(--text); line-height: 1.4; }
.dn-bcard-tags { display: flex; gap: 5px; flex-wrap: wrap; }
.dn-bcard-date { display: flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--text-3); }
.dn-bcol-add, .dn-bcol-newcol {
  display: flex; align-items: center; gap: 6px; padding: 8px 10px;
  font-size: 12.5px; color: var(--text-3); border-radius: 8px; font-weight: 500; width: 100%;
}
.dn-bcol-add:hover, .dn-bcol-newcol:hover { background: var(--hover); color: var(--text-2); }
.dn-bcol--ghost { flex: 0 0 130px; }

/* ===== Gallery view ===== */
.dn-gallery {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px;
}
.dn-gcard {
  background: var(--card); border: 1px solid var(--border-strong);
  border-radius: 11px; overflow: hidden; box-shadow: var(--shadow-card);
  transition: border-color .12s, transform .12s; cursor: pointer;
}
.dn-gcard:hover { border-color: var(--text-3); }
.dn-gcard-cover {
  height: 96px; display: grid; place-items: center; color: var(--text-3);
  background: color-mix(in srgb, var(--accent) 7%, var(--card));
  border-bottom: 1px solid var(--border);
}
.dn-gcard-body { padding: 12px 13px 14px; display: flex; flex-direction: column; gap: 9px; }
.dn-gcard-title { font-size: 13.5px; font-weight: 600; color: var(--text); }
.dn-gcard--add {
  display: grid; place-items: center; min-height: 150px; color: var(--text-3);
  border-style: dashed; box-shadow: none; background: transparent;
}
.dn-gcard--add:hover { color: var(--text-2); background: var(--hover); }

/* ===== Calendar view ===== */
.dn-cal-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.dn-cal-nav { display: flex; align-items: center; gap: 6px; }
.dn-cal-month { font-size: 16px; font-weight: 700; letter-spacing: -.2px; }
.dn-iconbtn {
  width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center;
  color: var(--text-2); border: 1px solid var(--border-strong);
}
.dn-iconbtn:hover { background: var(--hover); color: var(--text); }
.dn-cal-grid {
  display: grid; grid-template-columns: repeat(7, 1fr);
  border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
}
.dn-cal-dow {
  text-align: right; padding: 8px 10px; font-size: 11.5px; font-weight: 600;
  color: var(--text-3); border-bottom: 1px solid var(--border); background: var(--side-bg);
}
.dn-cal-dow.is-sun { color: var(--text-2); }
.dn-cal-dow.is-sat { color: var(--text-2); }
.dn-cal-cell {
  min-height: 92px; padding: 7px 8px; border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 4px;
}
.dn-cal-cell:nth-child(7n+1) { } /* sunday handled by num color */
.dn-cal-cell.is-out { background: color-mix(in srgb, var(--text-3) 5%, transparent); }
.dn-cal-num {
  font-size: 12.5px; font-weight: 600; color: var(--text-2); align-self: flex-end;
  min-width: 22px; height: 22px; display: grid; place-items: center; border-radius: 50%;
}
.dn-cal-num.is-sun { color: var(--text-2); }
.dn-cal-num.is-sat { color: var(--text-2); }
.dn-cal-cell.is-out .dn-cal-num { color: var(--text-3); opacity: .6; }
.dn-cal-num.is-today { background: var(--accent); color: var(--on-accent); }
.dn-cal-events { display: flex; flex-direction: column; gap: 3px; }
.dn-cal-ev {
  font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 5px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.dn-cal-ev--todo { color: var(--text-2); background: color-mix(in srgb, var(--text-3) 18%, transparent); }
.dn-cal-ev--doing { color: var(--text); background: color-mix(in srgb, var(--text-3) 30%, transparent); }
.dn-cal-ev--done { color: var(--on-accent); background: var(--accent); }

/* ===== Lock screen ===== */
.dn-lock {
  flex: 1; display: grid; place-items: center; background: var(--bg);
  background-image: radial-gradient(900px 500px at 50% -5%, color-mix(in srgb, var(--accent) 7%, var(--bg)) 0%, var(--bg) 60%);
}
.dn-lock-card {
  display: flex; flex-direction: column; align-items: center;
  width: 340px; text-align: center;
}
.dn-lock-card.shake { animation: dn-shake .4s; }
@keyframes dn-shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-7px)} 75%{transform:translateX(7px)} }
.dn-lock-badge { margin-bottom: 22px; }
.dn-lock-title { font-size: 22px; font-weight: 800; letter-spacing: -.4px; margin-bottom: 7px; }
.dn-lock-sub { font-size: 13.5px; color: var(--text-2); margin-bottom: 24px; }
.dn-lock-field {
  position: relative; width: 100%;
}
.dn-lock-field input {
  width: 100%; height: 46px; border-radius: 10px;
  border: 1.5px solid var(--border-strong); background: var(--card);
  padding: 0 44px 0 16px; font-size: 15px; color: var(--text);
  outline: none; transition: border-color .14s, box-shadow .14s;
  letter-spacing: 1px;
}
.dn-lock-field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
.dn-lock-eye {
  position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
  width: 34px; height: 34px; display: grid; place-items: center;
  color: var(--text-3); border-radius: 7px;
}
.dn-lock-eye:hover { color: var(--text-2); background: var(--hover); }
.dn-lock-btn { margin-top: 16px; width: 140px; }
.dn-lock-foot {
  display: flex; align-items: center; gap: 7px; margin-top: 30px;
  font-size: 11.5px; color: var(--text-3); font-weight: 500;
}

.dn-btn-primary {
  height: 42px; border-radius: 10px; background: var(--accent); color: var(--on-accent);
  font-size: 14px; font-weight: 650; padding: 0 20px;
  transition: filter .12s, transform .06s; box-shadow: 0 1px 2px rgba(0,0,0,.18);
}
.dn-btn-primary:hover { filter: brightness(1.12); }
.dn-btn-primary:active { transform: translateY(1px); }
.dn-btn-primary:disabled { opacity: .4; cursor: default; filter: none; transform: none; }

/* ===== Onboarding (first run) ===== */
.dn-onb {
  flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center;
  background: var(--bg);
  background-image: radial-gradient(900px 520px at 50% -8%, color-mix(in srgb, var(--accent) 7%, var(--bg)) 0%, var(--bg) 62%);
  padding: 26px 24px 36px; overflow-y: auto;
}
.dn-onb-steps { display: flex; align-items: flex-start; padding: 4px 0 26px; flex: 0 0 auto; }
.dn-onb-step { display: flex; flex-direction: column; align-items: center; gap: 7px; width: 66px; }
.dn-onb-step-dot {
  width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
  border: 1.5px solid var(--border-strong); color: var(--text-3); background: var(--card);
  transition: border-color .2s, color .2s, background .2s, box-shadow .2s;
}
.dn-onb-step.is-active .dn-onb-step-dot { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 12%, transparent); }
.dn-onb-step.is-done .dn-onb-step-dot { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.dn-onb-step-label { font-size: 11.5px; font-weight: 600; color: var(--text-3); }
.dn-onb-step.is-active .dn-onb-step-label, .dn-onb-step.is-done .dn-onb-step-label { color: var(--text); }
.dn-onb-line { width: 40px; height: 2px; background: var(--border-strong); margin: 17px -3px 0; align-self: flex-start; }
.dn-onb-line.is-fill { background: var(--accent); }

.dn-onb-stage { flex: 1; display: flex; align-items: center; justify-content: center; width: 100%; }
.dn-onb-panel { width: 100%; max-width: 460px; display: flex; flex-direction: column; align-items: center; text-align: center; animation: dn-onb-in .3s ease; }
@keyframes dn-onb-in { from { transform: translateY(10px) scale(.99); } to { transform: none; } }
.dn-onb-logo { margin-bottom: 22px; }
.dn-onb-head-ic { width: 58px; height: 58px; border-radius: 16px; display: grid; place-items: center; color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); margin-bottom: 18px; }
.dn-onb-done-ic { width: 74px; height: 74px; border-radius: 50%; display: grid; place-items: center; color: var(--on-accent); background: var(--accent); margin-bottom: 20px; }
.dn-onb-title { font-size: 24px; font-weight: 800; letter-spacing: -.5px; margin-bottom: 10px; }
.dn-onb-sub { font-size: 14px; line-height: 1.6; color: var(--text-2); max-width: 400px; margin-bottom: 26px; }
.dn-onb-feats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; margin-bottom: 30px; }
.dn-onb-feat { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 18px 10px; border: 1px solid var(--border); border-radius: 12px; background: var(--card); }
.dn-onb-feat-ic { width: 42px; height: 42px; border-radius: 11px; display: grid; place-items: center; color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
.dn-onb-feat-title { font-size: 13px; font-weight: 700; color: var(--text); }
.dn-onb-feat-desc { font-size: 11.5px; color: var(--text-3); }
.dn-onb-go { display: inline-flex; align-items: center; gap: 8px; }
.dn-onb-finish { font-size: 15px; height: 46px; padding: 0 24px; }
.dn-onb-form { width: 100%; display: flex; flex-direction: column; gap: 12px; margin-bottom: 26px; text-align: left; }
.dn-onb-form .dn-lock-field input { height: 44px; }
.dn-pw-strength { display: flex; align-items: center; gap: 10px; }
.dn-pw-bars { display: flex; gap: 5px; flex: 1; }
.dn-pw-bar { height: 4px; flex: 1; border-radius: 3px; background: var(--border-strong); transition: background .2s; }
.dn-pw-bar.is-on { background: var(--accent); }
.dn-pw-label { font-size: 11.5px; font-weight: 600; color: var(--text-2); }
.dn-onb-err { font-size: 12px; color: var(--text-2); font-weight: 500; }
.dn-onb-nav { display: flex; align-items: center; justify-content: space-between; width: 100%; gap: 12px; }
.dn-onb-back { display: inline-flex; align-items: center; gap: 5px; }

.dn-theme-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.dn-theme-card { border: 1.5px solid var(--border-strong); border-radius: 12px; overflow: hidden; background: var(--card); transition: border-color .15s, box-shadow .15s; }
.dn-theme-card.is-on { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 12%, transparent); }
.dn-theme-prev { display: flex; height: 74px; }
.dn-theme-card--light .dn-theme-prev { background: #fff; }
.dn-theme-card--light .dn-theme-prev-side { background: #f1f1f2; }
.dn-theme-card--light .dn-theme-prev-line { background: #d9d9dc; }
.dn-theme-card--dark .dn-theme-prev { background: #1d1e21; }
.dn-theme-card--dark .dn-theme-prev-side { background: #161719; }
.dn-theme-card--dark .dn-theme-prev-line { background: #3a3b40; }
.dn-theme-prev-side { width: 30%; }
.dn-theme-prev-main { flex: 1; padding: 14px 12px; display: flex; flex-direction: column; gap: 8px; }
.dn-theme-prev-line { height: 7px; border-radius: 4px; }
.dn-theme-card-foot { display: flex; align-items: center; gap: 7px; padding: 10px 12px; font-size: 13px; font-weight: 600; color: var(--text); border-top: 1px solid var(--border); }
.dn-theme-check { margin-left: auto; color: var(--accent); }
.dn-onb-tone { display: flex; align-items: center; justify-content: space-between; padding: 4px 2px; }
.dn-onb-tone-label { font-size: 13px; font-weight: 600; color: var(--text); }
.dn-onb-summary { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 340px; margin-bottom: 28px; }
.dn-onb-sum-row { display: flex; align-items: center; gap: 10px; font-size: 13.5px; color: var(--text); font-weight: 500; padding: 11px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--card); }
.dn-onb-sum-row svg { color: var(--accent); flex: 0 0 auto; }

/* ===== Installer (setup wizard) ===== */
.dn-inst-stage { width: 100vw; height: 100vh; display: grid; place-items: center;
  background:
    radial-gradient(120% 120% at 30% 0%, #2a2c33 0%, #15161a 60%, #0e0f12 100%);
  background-size: cover; padding: 24px; }
.dn-inst {
  width: 560px; max-width: 96vw; border-radius: 12px; overflow: hidden;
  background: var(--bg); color: var(--text);
  box-shadow: 0 40px 90px -24px rgba(0,0,0,.6), 0 0 0 1px rgba(0,0,0,.3);
  display: flex; flex-direction: column;
  font-size: calc(14px * var(--fs, 1));
  animation: dn-pop .2s ease-out;
}
.dn-inst[data-theme="light"] { --bg:#fff; --side-bg:#f5f5f6; --tb-bg:#ececee; --tb-border:#e0e0e2; --text:#1d1e21; --text-2:#6b6c70; --text-3:#9b9c9f; --border:#ececef; --border-strong:#dededf; --hover:#efeff0; --accent:#2b2d31; --on-accent:#fff; --code-bg:#f5f5f6; --card:#fff; }
.dn-inst[data-theme="dark"] { --bg:#1d1e21; --side-bg:#161719; --tb-bg:#242529; --tb-border:#303137; --text:#e8e8ea; --text-2:#9a9b9e; --text-3:#6a6b6e; --border:#2a2a2d; --border-strong:#36363a; --hover:#26262a; --accent:#cdced2; --on-accent:#18191b; --code-bg:#222326; --card:#202023; }

.dn-inst-titlebar { height: 32px; flex: 0 0 32px; display: flex; align-items: center; justify-content: space-between; background: var(--tb-bg); border-bottom: 1px solid var(--tb-border); padding: 0 4px 0 11px; }
.dn-inst-tb-left { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: var(--text-2); }
.dn-inst-tb-x { width: 38px; height: 26px; border-radius: 6px; display: grid; place-items: center; color: var(--text-2); }
.dn-inst-tb-x:hover { background: #e5484d; color: #fff; }

.dn-inst-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 22px; border-bottom: 1px solid var(--border); background: var(--side-bg); }
.dn-inst-header-text h2 { font-size: 16px; font-weight: 750; letter-spacing: -.2px; }
.dn-inst-header-text p { font-size: 12.5px; color: var(--text-2); margin-top: 3px; }
.dn-inst-header-ic { width: 44px; height: 44px; border-radius: 11px; display: grid; place-items: center; color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); flex: 0 0 auto; }

.dn-inst-body { padding: 22px; min-height: 268px; display: flex; flex-direction: column; }

/* welcome / done */
.dn-inst-welcome { flex: 1; display: flex; flex-direction: column; align-items: center; text-align: center; justify-content: center; }
.dn-inst-hero { margin-bottom: 18px; }
.dn-inst-welcome h1 { font-size: 21px; font-weight: 800; letter-spacing: -.4px; margin-bottom: 9px; }
.dn-inst-welcome p { font-size: 13.5px; line-height: 1.6; color: var(--text-2); max-width: 400px; margin-bottom: 20px; }
.dn-inst-ver { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.dn-inst-ver span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-size: 11.5px; font-weight: 600; color: var(--text-2); padding: 5px 11px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); }
.dn-inst-ver svg { color: var(--accent); }

/* license */
.dn-inst-license-wrap { flex: 1; display: flex; flex-direction: column; }
.dn-inst-license { flex: 1; height: 168px; overflow-y: auto; border: 1px solid var(--border-strong); border-radius: 9px; background: var(--card); padding: 14px 16px; font-size: 12.5px; line-height: 1.6; color: var(--text-2); display: flex; flex-direction: column; gap: 8px; }
.dn-inst-license b { color: var(--text); }
.dn-inst-agree { display: flex; align-items: center; gap: 10px; margin-top: 14px; font-size: 13.5px; font-weight: 600; cursor: pointer; user-select: none; }
.dn-inst-check { width: 19px; height: 19px; border-radius: 5px; border: 1.5px solid var(--border-strong); display: grid; place-items: center; color: var(--on-accent); flex: 0 0 auto; transition: background .12s, border-color .12s; }
.dn-inst-check.is-on { background: var(--accent); border-color: var(--accent); }

/* location */
.dn-inst-loc { flex: 1; display: flex; flex-direction: column; }
.dn-inst-loc-desc { font-size: 13px; color: var(--text-2); line-height: 1.6; margin-bottom: 16px; }
.dn-inst-pathrow { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; }
.dn-inst-folder-ic { color: var(--text-3); flex: 0 0 auto; }
.dn-inst-pathrow input { flex: 1; height: 40px; border-radius: 9px; border: 1.5px solid var(--border-strong); background: var(--card); padding: 0 13px; font-size: 13px; color: var(--text); outline: none; font-family: ui-monospace, Menlo, monospace; }
.dn-inst-pathrow input:focus { border-color: var(--accent); }
.dn-inst-browse { height: 40px; padding: 0 15px; border-radius: 9px; border: 1px solid var(--border-strong); background: var(--side-bg); font-size: 13px; font-weight: 600; color: var(--text); flex: 0 0 auto; white-space: nowrap; }
.dn-inst-browse:hover { background: var(--hover); }
.dn-inst-disk { border: 1px solid var(--border); border-radius: 9px; overflow: hidden; }
.dn-inst-disk-row { display: flex; justify-content: space-between; padding: 11px 14px; font-size: 13px; color: var(--text-2); }
.dn-inst-disk-row + .dn-inst-disk-row { border-top: 1px solid var(--border); }
.dn-inst-disk-row b { color: var(--text); font-weight: 700; }

/* components / options */
.dn-inst-opts { flex: 1; display: flex; flex-direction: column; gap: 8px; }
.dn-inst-opt { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; cursor: pointer; user-select: none; transition: border-color .12s, background .12s; }
.dn-inst-opt:hover { background: var(--hover); }
.dn-inst-opt-ic { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); flex: 0 0 auto; }
.dn-inst-opt-text { display: flex; flex-direction: column; gap: 1px; }
.dn-inst-opt-label { font-size: 13.5px; font-weight: 650; color: var(--text); }
.dn-inst-opt-desc { font-size: 11.5px; color: var(--text-3); }
.dn-inst-opt--flat { border: none; padding: 8px 0; }
.dn-inst-opt--flat:hover { background: none; }

/* installing */
.dn-inst-progress { flex: 1; display: flex; flex-direction: column; justify-content: center; }
.dn-inst-spinner-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.dn-inst-cpu { color: var(--accent); display: grid; place-items: center; animation: dn-pulse 1.4s ease-in-out infinite; }
@keyframes dn-pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
.dn-inst-prog-label { font-size: 13.5px; font-weight: 600; flex: 1; }
.dn-inst-prog-pct { font-size: 14px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
.dn-inst-bar { height: 9px; border-radius: 6px; background: var(--border-strong); overflow: hidden; }
.dn-inst-bar-fill { height: 100%; background: var(--accent); border-radius: 6px; transition: width .22s ease; }
.dn-inst-curfile { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--text-3); margin-top: 11px; display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dn-inst-loglist { margin-top: 14px; display: flex; flex-direction: column; gap: 4px; min-height: 92px; }
.dn-inst-logline { display: flex; align-items: center; gap: 7px; font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--text-2); }
.dn-inst-logline svg { color: var(--accent); }

/* done */
.dn-inst-done-ic { width: 70px; height: 70px; border-radius: 50%; display: grid; place-items: center; color: var(--on-accent); background: var(--accent); margin-bottom: 18px; }
.dn-inst-done-opts { display: flex; flex-direction: column; gap: 7px; align-items: flex-start; }
.dn-inst-done-note { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text-3); }
.dn-inst-done-note svg { color: var(--accent); }

/* footer */
.dn-inst-footer { display: flex; align-items: center; justify-content: space-between; padding: 14px 22px; border-top: 1px solid var(--border); background: var(--side-bg); }
.dn-inst-steps { font-size: 12px; color: var(--text-3); font-weight: 600; }
.dn-inst-btns { display: flex; gap: 9px; }
.dn-inst-btn { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; height: 38px; padding: 0 17px; border-radius: 9px; font-size: 13.5px; font-weight: 650; border: 1px solid var(--border-strong); background: var(--card); color: var(--text); transition: background .12s, filter .12s; }
.dn-inst-btn:hover:not(:disabled) { background: var(--hover); }
.dn-inst-btn.is-primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.dn-inst-btn.is-primary:hover:not(:disabled) { filter: brightness(1.12); }
.dn-inst-btn:disabled { opacity: .4; cursor: default; }
.dn-inst-btn.is-ghost { background: transparent; }


/* ===== Overlays / modals ===== */
.dn-overlay {
  position: absolute; inset: 0; background: var(--overlay);
  display: flex; justify-content: center; z-index: 50;
  backdrop-filter: blur(1.5px);
}
.dn-overlay--top { align-items: flex-start; padding-top: 96px; }
.dn-overlay--center { align-items: center; }
.dn-overlay-inner { animation: dn-pop .15s ease-out; }
@keyframes dn-pop { from { transform: translateY(-8px) scale(.985); } to { transform: none; } }

.dn-search, .dn-trash, .dn-notion {
  background: var(--modal-bg); border-radius: 14px; overflow: hidden;
  border: 1px solid var(--border-strong);
  box-shadow: 0 24px 60px -12px rgba(15,18,30,.4);
}
.dn-search { width: 600px; }
.dn-trash { width: 580px; }
.dn-notion { width: 600px; padding: 22px 24px 24px; }

.dn-search-head {
  display: flex; align-items: center; gap: 11px; padding: 16px 18px;
  border-bottom: 1px solid var(--border); color: var(--text-3);
}
.dn-search-head input {
  flex: 1; border: none; outline: none; background: none;
  font-size: 16px; color: var(--text);
}
.dn-search-head input::placeholder { color: var(--text-3); }
.dn-search-body { padding: 8px; min-height: 90px; max-height: 320px; overflow-y: auto; }
.dn-search-hint { padding: 28px; text-align: center; color: var(--text-3); font-size: 13.5px; }
.dn-search-item {
  display: flex; align-items: center; gap: 11px; width: 100%;
  padding: 9px 12px; border-radius: 8px; text-align: left;
}
.dn-search-item:hover { background: var(--hover); }
.dn-search-item-ic { color: var(--text-3); }
.dn-search-item-title { flex: 1; font-size: 14px; color: var(--text); font-weight: 500; }
.dn-search-item-type { font-size: 11.5px; color: var(--text-3); }
.dn-search-foot {
  display: flex; align-items: center; gap: 16px; padding: 10px 16px;
  border-top: 1px solid var(--border); font-size: 11.5px; color: var(--text-3);
}
.dn-search-foot-note { margin-left: auto; display: flex; align-items: center; gap: 6px; }

.dn-trash-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px; border-bottom: 1px solid var(--border);
}
.dn-trash-title { display: flex; align-items: center; gap: 9px; font-size: 15px; font-weight: 700; }
.dn-trash-count { font-size: 12px; color: var(--text-3); }
.dn-trash-body { padding: 8px; max-height: 340px; overflow-y: auto; }
.dn-trash-item { display: flex; align-items: center; gap: 11px; padding: 9px 12px; border-radius: 8px; }
.dn-trash-item:hover { background: var(--hover); }
.dn-trash-item-ic { color: var(--text-3); }
.dn-trash-item-title { flex: 1; font-size: 14px; color: var(--text); }
.dn-trash-actions { display: flex; gap: 4px; opacity: 0; transition: opacity .12s; }
.dn-trash-item:hover .dn-trash-actions { opacity: 1; }
.dn-textbtn { font-size: 12.5px; font-weight: 600; color: var(--text-2); padding: 4px 9px; border-radius: 6px; }
.dn-textbtn:hover { background: var(--hover); color: var(--text); }
.dn-textbtn--danger { color: var(--text); font-weight: 700; }
.dn-textbtn--danger:hover { background: var(--text); color: var(--bg); }

.dn-notion-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.dn-notion-title { display: flex; align-items: center; gap: 9px; font-size: 16px; font-weight: 700; }
.dn-notion-steps { padding-left: 18px; display: flex; flex-direction: column; gap: 9px; margin-bottom: 18px; }
.dn-notion-steps li { font-size: 13px; line-height: 1.6; color: var(--text-2); }
.dn-notion-steps b { color: var(--text); font-weight: 650; }
.dn-notion-steps code {
  font-family: ui-monospace, Menlo, monospace; font-size: 12px;
  background: var(--code-bg); padding: 1px 5px; border-radius: 4px; color: var(--text);
}
.dn-notion-fields { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
.dn-notion-fields input {
  height: 44px; border-radius: 9px; border: 1.5px solid var(--border-strong);
  background: var(--card); padding: 0 14px; font-size: 14px; color: var(--text); outline: none;
  transition: border-color .14s;
}
.dn-notion-fields input:focus { border-color: var(--accent); }
.dn-notion-fields input::placeholder { color: var(--text-3); }
.dn-notion-go { width: 100%; }
.dn-notion-foot {
  display: flex; align-items: center; gap: 8px; margin-top: 16px;
  font-size: 11.5px; color: var(--text-3);
}
.dn-notion-foot b { color: var(--text-2); }

/* ===== Settings page ===== */
.dn-settings { max-width: 860px; margin: 0 auto; padding: 48px 40px 120px; }
.dn-set-header { display: flex; align-items: center; gap: 16px; margin-bottom: 30px; }
.dn-set-header-ic {
  width: 56px; height: 56px; border-radius: 14px; display: grid; place-items: center;
  color: var(--text-2); background: color-mix(in srgb, var(--text-3) 12%, transparent);
}
.dn-set-title { font-size: 30px; font-weight: 800; letter-spacing: -.6px; }
.dn-set-sub { font-size: 13.5px; color: var(--text-2); margin-top: 3px; }

.dn-set-card { margin-bottom: 22px; }
.dn-set-card-head {
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase;
  color: var(--text-3); margin: 0 4px 9px;
}
.dn-set-card-body {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 14px; overflow: hidden; box-shadow: var(--shadow-card);
}
.dn-set-row {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 18px; border-bottom: 1px solid var(--border);
}
.dn-set-row.is-last { border-bottom: none; }
.dn-set-row-ic { color: var(--text-3); display: grid; place-items: center; flex: 0 0 auto; }
.dn-set-row-text { flex: 1; min-width: 0; }
.dn-set-row-title { font-size: 14px; font-weight: 600; color: var(--text); }
.dn-set-row-desc { font-size: 12.5px; color: var(--text-3); margin-top: 2px; }
.dn-set-row-control { flex: 0 0 auto; display: flex; align-items: center; }
.dn-set-meta { font-size: 13px; color: var(--text-2); font-weight: 500; }

/* segmented control */
.dn-seg {
  display: inline-flex; background: var(--hover); border-radius: 9px; padding: 3px;
  border: 1px solid var(--border);
}
.dn-seg-btn {
  padding: 5px 13px; border-radius: 7px; font-size: 12.5px; font-weight: 600;
  color: var(--text-2); transition: color .12s; white-space: nowrap;
}
.dn-seg-btn.is-on { background: var(--card); color: var(--text); box-shadow: var(--shadow-card); }

/* switch */
.dn-switch {
  width: 42px; height: 24px; border-radius: 14px; padding: 2px;
  background: color-mix(in srgb, var(--text-3) 40%, transparent); transition: background .16s; position: relative;
}
.dn-switch.is-on { background: var(--accent); }
.dn-switch-knob {
  display: block; width: 20px; height: 20px; border-radius: 50%;
  background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .16s;
}
.dn-switch.is-on .dn-switch-knob { transform: translateX(18px); }
.dn-window[data-theme="dark"] .dn-switch.is-on .dn-switch-knob { background: var(--on-accent); }

/* tone swatches */
.dn-tones { display: flex; gap: 7px; }
.dn-tone { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; border: 1.5px solid transparent; transition: border-color .12s; }
.dn-tone.is-on { border-color: var(--accent); }
.dn-tone-dot { width: 18px; height: 18px; border-radius: 50%; box-shadow: 0 0 0 1px rgba(0,0,0,.1) inset; }

/* stepper */
.dn-stepper {
  display: inline-flex; align-items: center; border: 1px solid var(--border-strong);
  border-radius: 9px; overflow: hidden; background: var(--card);
}
.dn-stepper button { width: 30px; height: 30px; display: grid; place-items: center; color: var(--text-2); }
.dn-stepper button:hover { background: var(--hover); color: var(--text); }
.dn-stepper-val { min-width: 52px; text-align: center; font-size: 12.5px; font-weight: 600; color: var(--text); border-left: 1px solid var(--border); border-right: 1px solid var(--border); height: 30px; line-height: 30px; }

.dn-status-ok { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; color: var(--text-2); }
.dn-status-ok .dn-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text); }
.dn-path { font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; color: var(--text-2); background: var(--code-bg); padding: 4px 9px; border-radius: 6px; }

/* ===== Version history modal ===== */
.dn-version {
  display: flex; width: 760px; height: 460px; background: var(--modal-bg);
  border-radius: 14px; overflow: hidden; border: 1px solid var(--border-strong);
  box-shadow: 0 24px 60px -12px rgba(15,18,30,.4);
}
.dn-version-list { width: 240px; flex: 0 0 240px; border-right: 1px solid var(--border); display: flex; flex-direction: column; background: var(--side-bg); }
.dn-version-head { display: flex; align-items: center; gap: 8px; padding: 16px 18px; font-size: 14px; font-weight: 700; border-bottom: 1px solid var(--border); }
.dn-version-scroll { flex: 1; overflow-y: auto; padding: 6px; }
.dn-version-item { display: flex; flex-direction: column; gap: 2px; width: 100%; text-align: left; padding: 9px 11px; border-radius: 8px; }
.dn-version-item:hover { background: var(--hover); }
.dn-version-item.is-sel { background: var(--active-bg); }
.dn-version-time { font-size: 13px; font-weight: 600; color: var(--text); }
.dn-version-label { font-size: 11.5px; color: var(--text-3); display: flex; align-items: center; gap: 6px; }
.dn-version-now { font-style: normal; font-size: 10px; font-weight: 700; color: var(--on-accent); background: var(--accent); padding: 1px 6px; border-radius: 5px; }
.dn-version-preview { flex: 1; display: flex; flex-direction: column; }
.dn-version-pv-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid var(--border); font-size: 12.5px; color: var(--text-2); font-weight: 500; }
.dn-version-actions { display: flex; align-items: center; gap: 8px; }
.dn-version-restore { height: 32px; font-size: 12.5px; padding: 0 14px; }
.dn-version-restore:disabled { opacity: .4; cursor: default; }
.dn-version-pv-body { flex: 1; padding: 32px 40px; position: relative; display: flex; flex-direction: column; gap: 13px; }
.dn-pv-line { height: 11px; border-radius: 6px; background: color-mix(in srgb, var(--text-3) 22%, transparent); width: 100%; }
.dn-pv-h { height: 20px; width: 55%; background: color-mix(in srgb, var(--text-3) 34%, transparent); margin-bottom: 8px; }
.dn-pv-gap { margin-top: 14px; }
.dn-version-watermark { position: absolute; bottom: 18px; right: 22px; font-size: 11px; color: var(--text-3); }

/* ===== Path control + folder picker ===== */
.dn-pathctl { display: flex; align-items: center; gap: 8px; }
.dn-pathctl .dn-path { max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dn-picker {
  width: 480px; background: var(--modal-bg); border-radius: 14px;
  border: 1px solid var(--border-strong); box-shadow: 0 24px 60px -12px rgba(15,18,30,.4);
  padding: 20px 22px 22px;
}
.dn-picker-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.dn-picker-title { display: flex; align-items: center; gap: 9px; font-size: 16px; font-weight: 700; }
.dn-picker-quick { display: flex; flex-direction: column; gap: 3px; margin-bottom: 16px; }
.dn-picker-item { display: flex; align-items: center; gap: 11px; padding: 9px 11px; border-radius: 9px; text-align: left; width: 100%; }
.dn-picker-item:hover { background: var(--hover); }
.dn-picker-item.is-sel { background: var(--active-bg); }
.dn-picker-item-ic { color: var(--text-3); flex: 0 0 auto; }
.dn-picker-item-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.dn-picker-item-label { font-size: 13.5px; font-weight: 600; color: var(--text); }
.dn-picker-item-path { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dn-picker-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
.dn-picker-field label { font-size: 12px; font-weight: 600; color: var(--text-2); }
.dn-picker-field input {
  height: 40px; border-radius: 9px; border: 1.5px solid var(--border-strong);
  background: var(--card); padding: 0 12px; outline: none; transition: border-color .14s;
  font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; color: var(--text);
}
.dn-picker-field input:focus { border-color: var(--accent); }
.dn-picker-foot { display: flex; justify-content: flex-end; gap: 8px; }
.dn-picker-go { height: 38px; font-size: 13px; padding: 0 16px; }
.dn-picker-go:disabled { opacity: .4; cursor: default; }


/* ===== Desktop sticky notes ===== */
.dn-sticky-layer { position: absolute; inset: 0; pointer-events: none; z-index: 60; }
.dn-sticky {
  position: absolute; width: 264px; border-radius: 5px; pointer-events: auto;
  display: flex; flex-direction: column; font-family: inherit;
  box-shadow: 0 12px 30px -8px rgba(18,18,28,.42), 0 2px 6px rgba(0,0,0,.15);
}
.dn-sticky.is-pinned { box-shadow: 0 16px 38px -8px rgba(18,18,28,.5), 0 0 0 1.5px rgba(0,0,0,.1); }
.dn-sticky-bar { display: flex; align-items: center; gap: 5px; padding: 5px 6px 5px 8px; cursor: grab; position: relative; border-radius: 5px 5px 0 0; }
.dn-sticky-bar:active { cursor: grabbing; }
.dn-sticky-title { flex: 1; font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: .82; }
.dn-sticky-actions { display: flex; align-items: center; gap: 0; }
.dn-sticky-btn { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 5px; color: inherit; opacity: .6; }
.dn-sticky-btn:hover { opacity: 1; background: rgba(0,0,0,.09); }
.dn-sticky-palette { position: absolute; top: 31px; right: 6px; display: flex; gap: 5px; padding: 6px; background: #fff; border-radius: 9px; box-shadow: 0 8px 22px rgba(0,0,0,.22); z-index: 5; }
.dn-sticky-dot { width: 18px; height: 18px; border-radius: 50%; box-shadow: 0 0 0 1px rgba(0,0,0,.12) inset; }
.dn-sticky-dot.is-on { box-shadow: 0 0 0 2px #2b2d31; }
.dn-sticky-body { flex: 1; border: none; outline: none; background: transparent; resize: none; padding: 6px 13px; font-size: 13.5px; line-height: 1.55; font-family: inherit; min-height: 116px; }
.dn-sticky-body::placeholder { color: currentColor; opacity: .4; }
.dn-sticky-foot { display: flex; align-items: center; justify-content: space-between; padding: 5px 13px 10px; font-size: 10.5px; font-weight: 600; }
.dn-sticky-sync { display: flex; align-items: center; gap: 5px; }
.dn-sticky-syncdot { width: 6px; height: 6px; border-radius: 50%; }
.dn-sticky-syncdot.is-busy { animation: dn-pulse 1s infinite; }
@keyframes dn-pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
.dn-sticky-open { cursor: pointer; opacity: .85; white-space: nowrap; }
.dn-sticky-open:hover { opacity: 1; text-decoration: underline; }

/* memo page (sticky-linked) */
.dn-memo-icon { color: var(--text-2); background: color-mix(in srgb, var(--text-3) 11%, transparent); }
.dn-memo-meta { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
.dn-memo-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--text-2); background: color-mix(in srgb, var(--text-3) 12%, transparent); padding: 4px 10px; border-radius: 7px; }
.dn-memo-sync { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--text-3); font-weight: 500; }
.dn-memo-syncdot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: dn-pulse 1.4s infinite; }
.dn-memo-editor { width: 100%; min-height: 340px; border: none; outline: none; background: transparent; resize: none; font-family: inherit; font-size: calc(16px * var(--fs, 1)); line-height: 1.8; color: var(--text); }
.dn-memo-editor::placeholder { color: var(--text-3); }

/* sidebar: new-sticky row + context menu */
.dn-srow.is-accent { color: var(--text-2); }
.dn-srow.is-accent .dn-srow-ic { color: var(--accent); }
.dn-ctxmenu { position: fixed; z-index: 200; background: var(--modal-bg); border: 1px solid var(--border-strong); border-radius: 10px; box-shadow: 0 12px 32px -8px rgba(15,18,30,.4); padding: 5px; min-width: 188px; }
.dn-ctxmenu-item { display: flex; align-items: center; gap: 9px; width: 100%; padding: 8px 11px; border-radius: 7px; font-size: 13px; font-weight: 500; color: var(--text); text-align: left; }
.dn-ctxmenu-item:hover:not(:disabled) { background: var(--hover); }
.dn-ctxmenu-item:disabled { color: var(--text-3); cursor: default; }
.dn-ctxmenu-item svg { color: var(--text-3); flex: 0 0 auto; }

.dn-doc-scroll::-webkit-scrollbar, .dn-sidebar::-webkit-scrollbar,
.dn-board::-webkit-scrollbar, .dn-search-body::-webkit-scrollbar,
.dn-trash-body::-webkit-scrollbar { width: 10px; height: 10px; }
.dn-doc-scroll::-webkit-scrollbar-thumb, .dn-sidebar::-webkit-scrollbar-thumb,
.dn-board::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--text-3) 40%, transparent); border-radius: 6px; border: 3px solid transparent; background-clip: padding-box; }
.dn-doc-scroll::-webkit-scrollbar-thumb:hover { background: color-mix(in srgb, var(--text-3) 60%, transparent); background-clip: padding-box; }
</style>
</head>
